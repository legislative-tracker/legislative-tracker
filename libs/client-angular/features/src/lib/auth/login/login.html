<div class="login-wrapper">
  <mat-card class="auth-card">
    <mat-card-header>
      <mat-card-title>Welcome Back</mat-card-title>
      <mat-card-subtitle>Sign in to your Legislative Tracker</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <p class="hint-text">
        Sign in with your preferred account to access your legislative districts
        & representatives.
      </p>

      <div class="auth-buttons-group">
        <!-- Google Sign-In -->
        <button
          type="button"
          class="auth-provider-btn btn-google"
          [disabled]="isLoading() !== null"
          (click)="login('google')"
        >
          <div class="btn-icon">
            <svg
              version="1.1"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 48 48"
              style="display: block"
            >
              <path
                fill="#EA4335"
                d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"
              ></path>
              <path
                fill="#4285F4"
                d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"
              ></path>
              <path
                fill="#FBBC05"
                d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"
              ></path>
              <path
                fill="#34A853"
                d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"
              ></path>
              <path fill="none" d="M0 0h48v48H0z"></path>
            </svg>
          </div>
          <span class="btn-text">
            @if (isLoading() === 'google') { Signing in... } @else { Sign in
            with Google }
          </span>
        </button>

        <!-- Apple Sign-In -->
        <button
          type="button"
          class="auth-provider-btn btn-apple"
          [disabled]="isLoading() !== null"
          (click)="login('apple')"
        >
          <div class="btn-icon">
            <svg
              viewBox="0 0 170 170"
              fill="currentColor"
              style="display: block"
            >
              <path
                d="M150.37 130.25c-2.45 5.66-5.35 10.87-8.71 15.66-4.58 6.53-8.33 11.05-11.22 13.56-4.48 4.12-9.28 6.23-14.42 6.35-3.69 0-8.14-1.05-13.32-3.18-5.19-2.12-9.97-3.17-14.34-3.17-4.58 0-9.49 1.05-14.75 3.17-5.26 2.13-9.5 3.24-12.74 3.35-4.35.13-9.16-1.9-14.42-6.08-3.7-3.04-7.7-7.85-12-14.42-6.09-9.33-10.74-20.02-13.97-32.06-3.23-12.04-4.85-23.27-4.85-33.68 0-14.28 3.7-25.99 11.09-35.14 7.4-9.15 16.5-13.8 27.31-13.97 4.9.11 10.22 1.37 15.96 3.77 5.75 2.41 9.68 3.68 11.8 3.82 1.63-.22 5.76-1.55 12.39-4 6.63-2.45 12.32-3.56 17.07-3.32 12.72.65 22.84 5.37 30.36 14.16-11.09 6.74-16.53 16.09-16.3 28.05.22 9.57 3.91 17.61 11.09 24.13 7.18 6.52 15.66 10.33 25.43 11.41-2.17 6.74-4.89 13.7-8.15 20.87zM119.22 31.84c0-7.18 2.61-13.92 7.83-20.22 5.22-6.3 11.74-10.22 19.57-11.74.22 1.09.33 2.17.33 3.26 0 7.18-2.72 14.02-8.15 20.54-5.43 6.52-12.06 10.33-19.89 11.42-.11-1.09-.11-2.17-.11-3.26z"
              ></path>
            </svg>
          </div>
          <span class="btn-text">
            @if (isLoading() === 'apple') { Signing in... } @else { Sign in with
            Apple }
          </span>
        </button>

        <!-- Facebook Sign-In -->
        <button
          type="button"
          class="auth-provider-btn btn-facebook"
          [disabled]="isLoading() !== null"
          (click)="login('facebook')"
        >
          <div class="btn-icon">
            <svg viewBox="0 0 24 24" fill="currentColor" style="display: block">
              <path
                d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"
              ></path>
            </svg>
          </div>
          <span class="btn-text">
            @if (isLoading() === 'facebook') { Signing in... } @else { Continue
            with Facebook }
          </span>
        </button>
      </div>

      @if (authError()) {
      <div class="error-box" role="alert">{{ authError() }}</div>
      }
    </mat-card-content>

    <mat-card-footer>
      <p class="footer-note">Secure login powered by Firebase Auth</p>
    </mat-card-footer>
  </mat-card>
</div>
