<div class="legislation-container">
  @if (isLoading()) {
    <div class="loading-shade">
      <mat-spinner diameter="50"></mat-spinner>
    </div>
  } @else if (error()) {
    <div class="error-container">
      <p>Unable to load legislation details.</p>
    </div>
  } @else if (legislation(); as item) {
    <mat-card class="header-card">
      <mat-card-header>
        <mat-card-title>{{ item.name }}</mat-card-title>
        @if (item.description) {
          <mat-card-subtitle>{{ item.description }}</mat-card-subtitle>
        }
      </mat-card-header>
    </mat-card>

    <mat-tab-group
      class="chamber-tabs"
      mat-stretch-tabs="true"
      animationDuration="0ms"
    >
      @if (upperBillId(); as upperId) {
        <mat-tab
          [label]="
            chamberNames().upper +
            (upperBillDisplayId() ? ' (' + upperBillDisplayId() + ')' : '')
          "
        >
          <div class="tab-content">
            <app-bill-detail
              [stateCd]="stateCd()"
              [id]="upperId"
              [updateSeoTags]="false"
            ></app-bill-detail>
          </div>
        </mat-tab>
      }
      @if (lowerBillId(); as lowerId) {
        <mat-tab
          [label]="
            chamberNames().lower +
            (lowerBillDisplayId() ? ' (' + lowerBillDisplayId() + ')' : '')
          "
        >
          <div class="tab-content">
            <app-bill-detail
              [stateCd]="stateCd()"
              [id]="lowerId"
              [updateSeoTags]="false"
            ></app-bill-detail>
          </div>
        </mat-tab>
      }
    </mat-tab-group>
  }
</div>
