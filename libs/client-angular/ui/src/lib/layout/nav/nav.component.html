<mat-toolbar color="primary" class="app-header">
  <button
    type="button"
    mat-icon-button
    (click)="drawer.toggle()"
    aria-label="Toggle navigation menu"
    [attr.aria-expanded]="drawer.opened"
  >
    <mat-icon style="color: white">menu</mat-icon>
  </button>

  <div class="branding-container">
    <img
      [src]="config().branding.logoUrl"
      alt="Legislative Tracker Logo"
      width="32"
      height="32"
    />
    <span class="title">| Legislative Tracker</span>
  </div>

  <span class="toolbar-spacer"></span>

  @if (!isOnline()) {
    <div class="offline-badge" role="status" aria-live="polite">
      <mat-icon
        style="
          font-size: 18px;
          width: 18px;
          height: 18px;
          vertical-align: middle;
        "
        >wifi_off</mat-icon
      >
      <span>Offline Mode</span>
    </div>
  }

  @if (auth.isLoggedIn() && currentFavoriteTarget(); as target) {
    <button
      mat-icon-button
      (click)="toggleFavorite()"
      [class.is-favorite]="isFavorited()"
      [attr.aria-label]="
        isFavorited()
          ? 'Remove ' + targetName() + ' from favorites'
          : 'Add ' + targetName() + ' to favorites'
      "
      [matTooltip]="
        isFavorited()
          ? 'Remove ' + targetName() + ' from favorites'
          : 'Add ' + targetName() + ' to favorites'
      "
      class="toolbar-favorite-btn"
    >
      <mat-icon [style.color]="isFavorited() ? '#e11d48' : 'white'">
        {{ isFavorited() ? 'favorite' : 'favorite_border' }}
      </mat-icon>
    </button>
  }

  <button
    mat-icon-button
    [matMenuTriggerFor]="themeMenu"
    aria-label="Select theme mode"
    [matTooltip]="'Theme: ' + themeService.mode()"
    class="theme-toggle-btn"
  >
    @switch (themeService.mode()) {
      @case ('light') {
        <mat-icon style="color: white">light_mode</mat-icon>
      }
      @case ('dark') {
        <mat-icon style="color: white">dark_mode</mat-icon>
      }
      @default {
        <mat-icon style="color: white">brightness_auto</mat-icon>
      }
    }
  </button>

  <mat-menu #themeMenu="matMenu">
    <button
      mat-menu-item
      (click)="themeService.setThemeMode('light')"
      [class.active-theme]="themeService.mode() === 'light'"
    >
      <mat-icon>light_mode</mat-icon>
      <span>Light</span>
      @if (themeService.mode() === 'light') {
        <mat-icon class="theme-check-icon">check</mat-icon>
      }
    </button>
    <button
      mat-menu-item
      (click)="themeService.setThemeMode('dark')"
      [class.active-theme]="themeService.mode() === 'dark'"
    >
      <mat-icon>dark_mode</mat-icon>
      <span>Dark</span>
      @if (themeService.mode() === 'dark') {
        <mat-icon class="theme-check-icon">check</mat-icon>
      }
    </button>
    <button
      mat-menu-item
      (click)="themeService.setThemeMode('system')"
      [class.active-theme]="themeService.mode() === 'system'"
    >
      <mat-icon>brightness_auto</mat-icon>
      <span>System</span>
      @if (themeService.mode() === 'system') {
        <mat-icon class="theme-check-icon">check</mat-icon>
      }
    </button>
  </mat-menu>
</mat-toolbar>

<mat-sidenav-container class="sidenav-container">
  <mat-sidenav
    #drawer
    class="sidenav"
    [attr.role]="(isHandset$ | async) ? 'dialog' : 'navigation'"
    [mode]="(isHandset$ | async) ? 'over' : 'side'"
    [opened]="(isHandset$ | async) === false"
  >
    <mat-nav-list>
      <a
        mat-list-item
        routerLink="/"
        routerLinkActive="active"
        (click)="onNavItemClick(drawer)"
      >
        <mat-icon matListItemIcon>home</mat-icon>
        <span matListItemTitle>Home</span>
      </a>
      <a
        mat-list-item
        routerLink="/about"
        routerLinkActive="active"
        (click)="onNavItemClick(drawer)"
      >
        <mat-icon matListItemIcon>info</mat-icon>
        <span matListItemTitle>About</span>
      </a>

      @if (auth.isLoggedIn()) {
        <a
          mat-list-item
          routerLink="/profile"
          routerLinkActive="active"
          (click)="onNavItemClick(drawer)"
        >
          <mat-icon matListItemIcon>person</mat-icon>
          <span matListItemTitle>Profile</span>
        </a>

        @if (auth.isAdmin()) {
          <a
            mat-list-item
            routerLink="/admin"
            routerLinkActive="active"
            (click)="onNavItemClick(drawer)"
          >
            <mat-icon matListItemIcon>settings</mat-icon>
            <span matListItemTitle>Admin</span>
          </a>
        }

        <div class="spacer"></div>

        <a mat-list-item (click)="handleLogout(drawer)">
          <mat-icon matListItemIcon>logout</mat-icon>
          <span matListItemTitle color="warn">Log Out</span>
        </a>
      }
      @if (!auth.isLoggedIn()) {
        <div class="spacer"></div>

        <a
          mat-list-item
          routerLink="/login"
          routerLinkActive="active"
          (click)="onNavItemClick(drawer)"
        >
          <mat-icon matListItemIcon>login</mat-icon>
          <span matListItemTitle>Login</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <div class="content-wrapper">
      <main class="main-content">
        <router-outlet />
      </main>
      <app-footer></app-footer>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
