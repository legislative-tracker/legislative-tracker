name: 'Setup Project Environment'
description: 'Checkout code, setup Node.js v24, install dependencies, and configure Nx SHAs.'

runs:
  using: 'composite'
  steps:
    - name: Checkout Code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci
      shell: bash

    - name: Derive Base & Head SHA for Nx Affected
      uses: nrwl/nx-set-shas@v5
