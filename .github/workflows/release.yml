name: Release Pipeline

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Automatic Version & Release
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.ADMIN_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Environment
        uses: ./.github/actions/setup-project

      - name: Fetch Git Tags
        run: git fetch --tags --force origin

      - name: Configure Git User
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump Application Version
        id: release
        run: |
          PREV_VERSION=$(node -e 'console.log(JSON.parse(fs.readFileSync("package.json")).version)')
          npx nx release version --group=app --git-commit=false --git-tag=false
          NEW_VERSION=$(node -e 'console.log(JSON.parse(fs.readFileSync("package.json")).version)')
          echo "VERSION=$NEW_VERSION" >> $GITHUB_OUTPUT
          if [ "$PREV_VERSION" != "$NEW_VERSION" ]; then
            echo "RELEASED=true" >> $GITHUB_OUTPUT
          else
            echo "RELEASED=false" >> $GITHUB_OUTPUT
          fi

      - name: Synchronize Version Constants
        if: steps.release.outputs.RELEASED == 'true'
        run: node scripts/sync-version.js ${{ steps.release.outputs.VERSION }}

      - name: Generate Application Changelog
        if: steps.release.outputs.RELEASED == 'true'
        run: npx nx release changelog --group=app ${{ steps.release.outputs.VERSION }} --git-commit=false --git-tag=false

      - name: Commit & Push Release Changes Directly
        if: steps.release.outputs.RELEASED == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add package.json package-lock.json libs/client-angular/core/src/lib/version.ts docs/CHANGELOG.md || true
          git commit -m "chore(release): v${{ steps.release.outputs.VERSION }} [skip ci]"
          git push origin HEAD:main

      - name: Create Git Tag & GitHub Release
        if: steps.release.outputs.RELEASED == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! git rev-parse "v${{ steps.release.outputs.VERSION }}" >/dev/null 2>&1; then
            git tag -a "v${{ steps.release.outputs.VERSION }}" -m "v${{ steps.release.outputs.VERSION }}"
            git push origin "v${{ steps.release.outputs.VERSION }}" || true
          fi
          gh release create "v${{ steps.release.outputs.VERSION }}" --title "v${{ steps.release.outputs.VERSION }}" --generate-notes || true
