name: Release Pipeline

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch Git Tags
        run: git fetch --tags --force origin

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Configure Git User
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump Application Version & Changelog
        id: release
        run: |
          PREV_VERSION=$(node -e 'console.log(JSON.parse(fs.readFileSync("package.json")).version)')
          npx nx release version --group=app
          NEW_VERSION=$(node -e 'console.log(JSON.parse(fs.readFileSync("package.json")).version)')
          node scripts/sync-version.js $NEW_VERSION
          npx nx release changelog --group=app $NEW_VERSION
          echo "VERSION=$NEW_VERSION" >> $GITHUB_OUTPUT
          if [ "$PREV_VERSION" != "$NEW_VERSION" ]; then
            echo "RELEASED=true" >> $GITHUB_OUTPUT
          else
            echo "RELEASED=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit & Tag Release
        if: steps.release.outputs.RELEASED == 'true'
        run: |
          git add package.json apps/server-firebase/package.json libs/client-angular/core/src/lib/version.ts docs/CHANGELOG.md || true
          if [ -n "$(git status --porcelain)" ]; then
            HUSKY=0 git commit -m "chore(release): v${{ steps.release.outputs.VERSION }} [skip ci]"
          fi
          if ! git rev-parse "v${{ steps.release.outputs.VERSION }}" >/dev/null 2>&1; then
            git tag -a "v${{ steps.release.outputs.VERSION }}" -m "v${{ steps.release.outputs.VERSION }}"
            git push origin main --tags
          fi

      - name: Create GitHub Release
        if: steps.release.outputs.RELEASED == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.release.outputs.VERSION }}" --title "v${{ steps.release.outputs.VERSION }}" --notes-from-tag || true
