name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Derive Base & Head SHA for Nx Affected
        uses: nrwl/nx-set-shas@v4

      - name: Nx Affected Lint
        run: npx nx affected -t lint

      - name: Nx Affected Test
        run: npx nx affected -t test --watch=false

      - name: Nx Affected Build
        run: npx nx affected -t build
