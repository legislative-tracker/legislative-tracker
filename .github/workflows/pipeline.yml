name: Pipeline Orchestrator

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  changes:
    name: Detect Deployable Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - 'apps/**'
              - 'libs/**'

  pr-title:
    name: PR Title Lint
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/pr-title.yml

  ci:
    name: Code Quality (Lint & Format)
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.event_name == 'pull_request'
    uses: ./.github/workflows/ci.yml

  test:
    name: Unit & E2E Testing
    needs: [changes, ci]
    if: needs.changes.outputs.code == 'true' && github.event_name == 'pull_request'
    uses: ./.github/workflows/test.yml

  release:
    name: Release Automation
    needs: [changes, ci]
    if: needs.changes.outputs.code == 'true' && github.event_name == 'push'
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/release.yml

  build:
    name: Build Targets
    needs: [changes, test, release]
    if: always() && needs.changes.outputs.code == 'true' && (needs.test.result == 'success' || needs.release.result == 'success')
    uses: ./.github/workflows/build.yml

  deploy:
    name: Firebase Deployment
    needs: [changes, build]
    if: needs.changes.outputs.code == 'true' && github.event_name == 'push'
    secrets: inherit
    uses: ./.github/workflows/deploy.yml
