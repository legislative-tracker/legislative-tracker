name: Build Pipeline

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    name: Build Monorepo Targets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Environment
        uses: ./.github/actions/setup-project

      - name: Nx Affected Build
        run: npx nx affected -t build
